---
# ExternalSecret: postgres-credentials
# Syncs 'postgres-password' from local-credentials into a Secret that
# CloudNativePG and Postgres-backed services consume.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.storeName }}
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.eso.sourceSecret }}
        property: postgres-username
    - secretKey: password
      remoteRef:
        key: {{ .Values.eso.sourceSecret }}
        property: postgres-password
---
# ExternalSecret: rabbitmq-credentials
# Syncs 'rabbitmq-password' from local-credentials into a Secret that
# all services use to connect to RabbitMQ.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.storeName }}
    kind: ClusterSecretStore
  target:
    name: rabbitmq-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.eso.sourceSecret }}
        property: rabbitmq-password
---
# ExternalSecret: github-gateway-credentials
# Syncs the three sensitive bits the github-gateway service needs at boot:
#   - github-app-private-key-pem : RSA private key from the GitHub App
#   - github-webhook-secret      : HMAC secret matching the App's webhook config
#   - verifier-encryption-key    : base64 32-byte AES-256 key for pending-link verifiers
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-gateway-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.storeName }}
    kind: ClusterSecretStore
  target:
    name: github-gateway-credentials
    creationPolicy: Owner
  data:
    - secretKey: github-app-private-key-pem
      remoteRef:
        key: {{ .Values.eso.sourceSecret }}
        property: github-app-private-key-pem
    - secretKey: github-webhook-secret
      remoteRef:
        key: {{ .Values.eso.sourceSecret }}
        property: github-webhook-secret
    - secretKey: verifier-encryption-key
      remoteRef:
        key: {{ .Values.eso.sourceSecret }}
        property: verifier-encryption-key
