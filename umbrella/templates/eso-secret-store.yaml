---
# ClusterSecretStore backed by a Kubernetes Secret.
# The source Secret ('local-credentials') is created by bin/deploy-local.sh
# with placeholder values and is never committed to the repo.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.eso.storeName }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        # In-cluster — no URL needed
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-secret-store-sa
          namespace: {{ .Release.Namespace }}
---
# ServiceAccount used by ESO to read from the local-credentials Secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-secret-store-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secret-store-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.eso.sourceSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secret-store-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-secret-store-reader
subjects:
  - kind: ServiceAccount
    name: eso-secret-store-sa
    namespace: {{ .Release.Namespace }}
