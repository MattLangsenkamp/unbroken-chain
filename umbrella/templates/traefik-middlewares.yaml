---
# Strip /github-gateway prefix before forwarding to the github-gateway backend
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-github-gateway-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /github-gateway
---
# Strip /control-plane prefix before forwarding to the ubc-control-plane backend
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-control-plane-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /control-plane
---
# Strip /reader prefix before forwarding to the reader backend
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-reader-prefix
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /reader
