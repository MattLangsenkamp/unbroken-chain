replicaCount: 1

image:
  repository: "unbrokenchain/reader"
  tag: latest
  pullPolicy: IfNotPresent

# Set to true (and configure host/db/user) for services that need Postgres
postgres:
  enabled: false
  host: unbroken-chain-pg-rw
  db: ""
  user: app

rabbitmq:
  host: unbroken-chain-rabbitmq
  user: user

otel:
  endpoint: "http://otel-collector-collector:4317"

ingress:
  enabled: true
  host: api.localhost
  path: /reader/

extraEnv: []

resources: {}

