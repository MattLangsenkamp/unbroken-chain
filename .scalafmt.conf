version = "3.10.7"
runner.dialect = scala3

maxColumn = 120

align.preset = more
align.tokens."+" = [
  { code = "=",  owner = "(Enumerator.Val|Defn.(Va[lr]|Def|Type|Given))" },
  { code = "<-", owner = "Enumerator.Generator" },
  { code = "->", owner = "Term.ApplyInfix" },
  { code = "%",  owner = "Term.ApplyInfix" },
  { code = "%%", owner = "Term.ApplyInfix" },
]