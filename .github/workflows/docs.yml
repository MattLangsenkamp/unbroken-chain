name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/docs/**'
      - 'site/**'
      - 'bin/docs-*.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '**/docs/**'
      - 'site/**'
      - 'bin/docs-*.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: site/uv.lock
      - name: Build docs
        run: bin/docs-build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
