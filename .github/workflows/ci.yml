name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Scalafmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: mill-${{ runner.os }}-
      - name: Check formatting
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll

  build-and-test:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    env:
      # Minimum aggregate statement coverage that blocks the merge. Baseline at
      # introduction was 72.68%; raise this as coverage improves.
      COVERAGE_MIN: "70"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: mill-${{ runner.os }}-
      # Compiles the whole build, including the Scala.js presentation and stub server
      # modules that `__.test` would never reach on its own.
      - name: Compile
        run: ./mill __.compile
      # Instrumented run — every test module extends ScoverageTests. The magnum-*
      # repository tests use Testcontainers; Docker is preinstalled on ubuntu runners.
      - name: Test
        run: ./mill __.test
      - name: Coverage gate
        run: make coverage-check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: out/scoverage/htmlReportAll.dest
          if-no-files-found: ignore

  verify-deploy-deps:
    name: No test deps in deployables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: mill-${{ runner.os }}-
      - name: Verify deploy classpaths
        run: make verify-deploy-deps
