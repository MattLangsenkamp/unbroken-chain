# Scala Steward repo-specific configuration.
# https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# Supply-chain cooldown: ignore any dependency version younger than this. Gives the
# ecosystem time to yank a compromised or broken release before we ever pull it.
# Requires scala-steward >= 0.38.0.
updates.cooldown = {
  minimumAge = "7 days"
}

# Batch updates once a week rather than opening PRs as soon as releases appear.
pullRequests.frequency = "7 days"

# Cap the number of update PRs opened per run to keep review load and CI cost sane.
updates.limit = 5
